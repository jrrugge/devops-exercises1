name: aws-oidc-test

on:
  pull_request:
    paths:
      - ".github/workflows/aws-oidc-test.yml"

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      
      - name: Show the OIDC claims we are sending
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | python3 -c '
          import sys, json, base64
          p = sys.stdin.read().strip().split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ["sub","aud","iss","repository","ref","event_name"]}, indent=2))
          '

      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::529088292338:role/smartlead-github-deploy
          aws-region: us-east-1

      - name: Show who we are
        run: aws sts get-caller-identity